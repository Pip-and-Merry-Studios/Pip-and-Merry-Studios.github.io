<style>
/* The page is the drawing's paper: the same off-white, charcoal ink for type. */
:root{--paper:#F3ECE0;--card:#FBF7EF;--ink:#24201E;--soft:#5E564F;--line:#DDD3C3;--accent:#8A4B1F}
@media (prefers-color-scheme: dark){
  :root{--paper:#1B1917;--card:#252220;--ink:#F1EADD;--soft:#B4AA9C;--line:#3A3531;--accent:#E3A56B}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 24px 56px;display:flex;flex-direction:column;gap:44px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
/* The logo is pixel art exported at 6x; the browser scales it down, so it stays crisp at any width. */
h1{margin:0;line-height:0;width:100%;display:flex;justify-content:center}
h1 img{width:min(440px,100%);height:auto}
#logo{display:block;width:min(440px,100%);aspect-ratio:172/62;image-rendering:pixelated;image-rendering:crisp-edges}
.tag{margin:0;color:var(--soft);text-wrap:balance}
h2{font:600 13px/1 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin:0 0 12px}
.app{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
.app:hover,.app:focus-visible{border-color:var(--accent)}
.app img{border-radius:22.5%;flex:none}
.app b{font:600 20px/1.2 Fraunces,Georgia,serif;display:block}
.app span{color:var(--soft);font-size:15.5px}
.app small{display:block;margin-top:6px;font-size:13.5px;color:var(--accent);font-weight:600}
.links{margin:10px 4px 0;font-size:14.5px;color:var(--soft)}
a{color:var(--accent)}
footer{border-top:1px solid var(--line);padding-top:20px;font-size:14.5px;color:var(--soft);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer p{margin:0}
</style>
</head>
<body>
<main>
<header>
<h1><canvas id="logo" role="img" aria-label="Pip &amp; Merry Studios"></canvas><noscript><picture><source srcset="logo-dark.png" media="(prefers-color-scheme: dark)"><img src="logo-light.png" width="1044" height="384" alt="Pip &amp; Merry Studios"></picture></noscript></h1>
<p class="tag">One person. Two cats. Good apps.</p>
</header>

<section>
<h2>Apps</h2>
<a class="app" href="farkle-keeper/">
<img src="farkle-keeper/icon.png" alt="" width="72" height="72">
<div><b>Farkle Keeper</b><span>The scorecard for Farkle nights played with real dice.</span><small>Coming soon to the App Store</small></div>
</a>
<p class="links"><a href="farkle-keeper/">Support</a> · <a href="farkle-keeper/privacy.html">Privacy</a></p>
</section>

<footer>
<p>Questions? <a href="mailto:support@pipandmerrystudios.com">support@pipandmerrystudios.com</a></p>
<p>© 2026 Pip &amp; Merry Studios</p>
</footer>
</main>
<script src="logo.js" defer></script>
</body>
</html>
